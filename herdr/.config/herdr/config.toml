onboarding = false
# 配置先: ~/.config/herdr/config.toml (stow で symlink)。tmux 設定と同じ操作感に合わせている。
# 対応関係: tmux window → herdr space（作業単位・主役） / tmux pane → herdr tab / pane（補助）
# ペイン分割の命名差に注意: herdr は Vim 流 (split_vertical=左右 / split_horizontal=上下)、tmux は逆。

[theme]
name = "tokyo-night"                # tmux 20-style.conf と同系の Tokyo Night

[terminal]
default_shell = "/bin/zsh"          # tmux: set-option -g default-shell /bin/zsh
shell_mode = "login"                # tmux: set-option -g default-command "zsh -l"
new_cwd = "follow"                  # tmux: new-window/split-window -c "#{pane_current_path}"

[keys]
prefix = "ctrl+space"               # tmux: set -g prefix C-Space
detach = "prefix+d"                 # tmux 既定 bind d detach-client に合わせる

# space (workspace) = tmux window 相当
new_workspace = "prefix+shift+n"    # 素の新規作成（cwd 引き継ぎ）。場所を選んで作るのは prefix+n の hspace ピッカーへ
next_workspace = "ctrl+j"           # 上下移動は vim 流 j=次/k=前、prefix 不要の単独キー
previous_workspace = "ctrl+k"       # ctrl+j/k はペインへ渡らなくなるため nvim 側の同キー割り当ては削除済み

# tab は使わない運用（space 内は基本 1 tab、タブバーも [ui] hide_tab_bar_when_single_tab で隠す）
new_tab = ""
switch_tab = ""
next_tab = ""
previous_tab = ""

# ペイン分割 (tmux 40-keymaps.conf)
split_horizontal = "prefix+v"       # tmux: bind v split-window -v（上下）
split_vertical = "prefix+h"         # tmux: bind h split-window -h（左右）
close_pane = "prefix+x"             # tmux: bind x kill-pane
zoom = "prefix+z"                   # tmux: bind z resize-pane -Z
cycle_pane_next = "ctrl+t"          # tmux: bind -n C-t select-pane -t :.+（prefix 不要）

# 方向移動は tmux に合わせて無効化（tmux は ctrl+t 巡回のみで hjkl 移動を使っていない）
focus_pane_left = ""                # prefix+h は split_vertical で使用中のため空けておく
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

edit_scrollback = ""                # 下の [[keys.command]] prefix+e (nvim popup) と衝突するため無効化

# 補足（tmux から素直に移せない項目）:
# リサイズは prefix+r (resize_mode) → 矢印/hjkl。コピペはマウス選択+内蔵クリップボード連携で代替。
# ステータスラインは herdr のサイドバー UI に置き換わる。

new_worktree = ""                   # herdr 内蔵の worktree 作成は使わない（swws/devpick で自前管理しているため無効化）

[ui]
agent_panel_sort = "spaces"         # エージェントパネルを space ごとにグループ表示
hide_tab_bar_when_single_tab = true # tab を使わない運用のため 1 tab 時は上部タブバーを隠す
show_agent_labels_on_pane_borders = true # タブバーを隠す運用のため、ペイン境界に agent 名を出して見分ける

[ui.toast]
delivery = "terminal"               # 端末側の通知機能経由でデスクトップ通知（SSH越しでも動く。system直叩きより確実）

[[keys.command]]
key = "prefix+n"
type = "popup"
command = '''export PATH="$HOME/.nix-profile/bin:$HOME/.local/bin:$PATH"; dir=$(zsh -c "source $HOME/.zsh/50-herdr.zsh; devpick"); [ -n "$dir" ] && herdr workspace create --cwd "$dir" --focus'''
width = "70%"
height = "60%"

